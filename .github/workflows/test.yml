name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test test/*.test.js

  # Runs the action for real against the live API with a token that can't work.
  # Proves the CLI installs, the API is reached, the failure is reported as an
  # error, and the post step cleans up without crashing.
  bad-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: phone
        uses: ./
        continue-on-error: true
        with:
          token: not-a-real-token
          wait-timeout: "10"
      - name: expect a failure
        run: test "${{ steps.phone.outcome }}" = "failure"

  # Holds a real phone for a moment, only where a token secret is configured.
  live:
    runs-on: ubuntu-latest
    env:
      HAVE_TOKEN: ${{ secrets.CLOUDFONE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
        if: env.HAVE_TOKEN == 'true'
      - id: phone
        if: env.HAVE_TOKEN == 'true'
        uses: ./
        with:
          token: ${{ secrets.CLOUDFONE_TOKEN }}
      - if: env.HAVE_TOKEN == 'true'
        run: echo "held ${{ steps.phone.outputs.serial }} (${{ steps.phone.outputs.model }}, ${{ steps.phone.outputs.carrier }}, Android ${{ steps.phone.outputs.android-version }})"
      - if: env.HAVE_TOKEN != 'true'
        run: echo "no CLOUDFONE_TOKEN secret, skipping the live phone test"
